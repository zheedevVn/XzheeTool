<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glow & Accents -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#F05138"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F05138" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radial ambient lights -->
    <radialGradient id="radial-cyan" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radial-orange" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F05138" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F05138" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>

  <!-- Ambient Light Circles -->
  <circle cx="240" cy="80" r="280" fill="url(#radial-cyan)"/>
  <circle cx="960" cy="280" r="280" fill="url(#radial-orange)"/>

  <!-- Subtle Tech Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>

    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="18.5" fill="none" stroke="url(#card-border)" stroke-width="2"/>

  <!-- Main Content Centered -->
  <g text-anchor="middle">
    <!-- Top Pill / Status -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-114" cy="0" r="4.5" fill="#10B981"/>
      <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">NEXT-GEN IOS TOOLCHAIN</text>
    </g>

    <!-- Project Title with Gradient -->
    <text x="600" y="162" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#primary-glow)" letter-spacing="-1.5" filter="url(#shadow)">
      XzheeTool
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#F1F5F9" letter-spacing="0.2">
      Cross-Platform Replacement for Xcode
    </text>

    <!-- Detail Tagline in Vietnamese / English -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      Build, Code-Sign &amp; Deploy iOS Apps with SwiftPM on Linux, Windows (WSL) &amp; macOS
    </text>

    <!-- Badges / Platform Chips at Bottom -->
    <g transform="translate(600, 296)">
      <!-- Chip 1: Linux -->
      <g transform="translate(-255, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#60A5FA">🐧 Linux</text>
      </g>
      <!-- Chip 2: Windows WSL -->
      <g transform="translate(-100, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38BDF8">🪟 Windows (WSL)</text>
      </g>
      <!-- Chip 3: macOS -->
      <g transform="translate(60, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#C084FC">🍎 macOS</text>
      </g>
      <!-- Chip 4: Swift 6.0 -->
      <g transform="translate(210, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FB923C">⚡ Swift 6.0+</text>
      </g>
    </g>
  </g>
</svg>
